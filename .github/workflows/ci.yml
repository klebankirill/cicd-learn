name: CI
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pytest flask
      - name: Run tests
        run: python -m pytest -v
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t $DOCKERHUB_USERNAME/hello-app:latest .

      - name: Push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "Pushing with user: [${DOCKERHUB_USERNAME}]"
          docker push $DOCKERHUB_USERNAME/hello-app:latest
  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Pull latest image
        run: docker pull skyyday/hello-app:latest

      - name: Stop and remove old container
        run: |
          docker stop hello-app 2>/dev/null || true
          docker rm hello-app 2>/dev/null || true

      - name: Run new container
        run: docker run -d -p 5000:5000 --name hello-app skyyday/hello-app:latest

      - name: Show running containers
        run: docker ps
