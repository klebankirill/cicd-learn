name: CI
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pytest
      - name: Run tests
        run: python -m pytest -v
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "=== DEBUG INFO ==="
          echo "Length: ${#DOCKERHUB_USERNAME}"
          echo "First 3 chars: ${DOCKERHUB_USERNAME:0:3}"
          echo "Last 3 charts: ${DOCKERHUB_USERNAME: -3}"
          echo "=== END DEBUG ==="
          docker build -t $DOCKERHUB_USERNAME/hello-app:latest .
          docker push $DOCKERHUD_USERNAME/hello-app:latest

