services:
  app:
    image: skyyday/hello-app:latest
    ports:
      - "5000:5000"
    restart: always

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus.yml
    restart: always


  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    restart: always
