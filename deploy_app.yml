---
- name: Deploy Hello App
  hosts: webservers
  become: yes

  tasks:
    - name: Ensure project directory exists
      file:
        path: /home/kirill/cicd-learn
        state: directory

    - name: Copy docker-compose.yml
      copy:
        src: docker-compose.yml
        dest: /home/kirill/cicd-learn/docker-compose.yml
    - name: Run docker compose up
      community.docker.docker_compose_v2:
        project_src: /home/kirill/cicd-learn
        state: present
        pull: always
